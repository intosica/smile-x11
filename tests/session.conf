<!-- Private test bus: no service activation, so xdg-desktop-portal & friends never start (their
     secret-service timeouts used to stall application registration for 25 s). -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
